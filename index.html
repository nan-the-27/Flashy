<style>
  /* App-like CSS Resets */
  * { 
    box-sizing:border-box; 
    -webkit-tap-highlight-color:transparent; 
    -webkit-user-select:none; 
    user-select:none; 
    -webkit-touch-callout:none; 
  }
  html,body { 
    margin:0; width:100%; height:100%; 
    background:#000; overflow:hidden; 
    touch-action:none; /* Prevents pull-to-refresh */
  }
  
  .stage { width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
  svg { width:min(90vw, 900px); height:auto; max-height:80vh; display:block; }
  
  /* Respect Safe Areas (Notches) for UI Elements */
  .dot {
    position:fixed; top:max(16px, env(safe-area-inset-top)); right:max(16px, env(safe-area-inset-right)); width:8px; height:8px; border-radius:50%;
    background:#2a2a2a; box-shadow:0 0 6px rgba(255,255,255,0.05); cursor:pointer; z-index:10;
  }
  .dot.live { background:#32d74b; box-shadow:0 0 8px #32d74b; animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  
  .drive-btn {
    position:fixed; top:max(14px, env(safe-area-inset-top)); right:max(34px, env(safe-area-inset-right)); width:26px; height:26px; border-radius:50%;
    border:1px solid #333; background:#111; cursor:pointer; z-index:10; transition:all .2s;
    display:flex; align-items:center; justify-content:center;
  }
  .drive-btn svg { width:14px; height:14px; stroke:#555; transition:stroke .2s; }
  .drive-btn.on { border-color:#32d74b; box-shadow:0 0 8px rgba(50,215,75,0.4); }
  .drive-btn.on svg { stroke:#32d74b; }
  
  .sim-toggle {
    position:fixed; top:max(16px, env(safe-area-inset-top)); right:max(64px, env(safe-area-inset-right)); width:8px; height:8px; border-radius:50%;
    background:#1a1a1a; cursor:pointer; z-index:10; transition:background .2s, box-shadow .2s;
  }
  .sim-toggle.open { background:#32d74b; box-shadow:0 0 8px #32d74b; }
  
  .sim-panel {
    position:fixed; left:50%; bottom:max(18px, env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(12px);
    width:min(92vw, 360px); background:rgba(12,12,12,0.85); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid #262626; border-radius:12px;
    padding:12px; z-index:20; opacity:0; pointer-events:none; transition:opacity .3s cubic-bezier(0.2,0.8,0.2,1), transform .3s cubic-bezier(0.2,0.8,0.2,1);
    font:11px/1.4 -apple-system, system-ui, sans-serif; color:#777;
  }
  .sim-panel.open { opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }
  .sim-row { display:flex; gap:6px; margin-bottom:8px; }
  .sim-row:last-child { margin-bottom:0; }
  .sim-btn {
    flex:1; background:#181818; border:1px solid #2a2a2a; color:#bbb; border-radius:7px;
    padding:7px 4px; font:11px inherit; cursor:pointer; text-align:center; transition:0.15s;
  }
  .sim-btn:active { background:#32d74b; color:#000; border-color:#32d74b; }
  
  .sim-slider-row { display:flex; align-items:center; gap:8px; }
  .sim-slider-row input[type=range] { flex:1; accent-color:#32d74b; }
  .sim-slider-row span { width:60px; text-align:right; color:#32d74b; font-weight:500; }

  /* Premium Debug Menu */
  .hidden-trigger { position:fixed; top:max(0px, env(safe-area-inset-top)); left:max(0px, env(safe-area-inset-left)); width:60px; height:60px; z-index:100; cursor:pointer; }
  .expr-menu {
    position:fixed; top:max(20px, env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    width:min(95vw, 650px); display:flex; flex-wrap:wrap; gap:6px; justify-content:center;
    background:rgba(15,15,15,0.75); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:16px;
    z-index:90; opacity:0; pointer-events:none; transition:opacity 0.25s ease-out;
  }
  .expr-menu.open { opacity:1; pointer-events:auto; }
  .expr-btn {
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.05); color:#dedede; border-radius:8px;
    padding:7px 12px; font:12px -apple-system, system-ui, sans-serif; font-weight:500; cursor:pointer; text-align:center; transition:0.2s;
  }
  .expr-btn:active, .expr-btn:hover { background:#32d74b; color:#000; border-color:#32d74b; }

  /* Fluid transitions for rendering */
  #eyesGroup { transition: fill 0.4s cubic-bezier(0.2,0.8,0.2,1); }
  #pathMouth { transition: stroke 0.4s cubic-bezier(0.2,0.8,0.2,1), opacity 0.4s cubic-bezier(0.2,0.8,0.2,1); }
  .hud-item { opacity:0; transition:opacity 0.4s cubic-bezier(0.2,0.8,0.2,1); }
  .hud-item.active { opacity:1; animation:hud-float 3s ease-in-out infinite; }
  @keyframes hud-float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
</style>

  function catmullRomToBezier(pts, closed = true) {
    const n = pts.length;
    if (n === 0) return '';
    let d = `M ${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)} `;
    if (closed) {
      for (let i = 0; i < n; i++) {
        const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
        const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
        const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
        d += `C ${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)} `;
      }
      return d + 'Z';
    } else {
      for (let i = 0; i < n - 1; i++) {
        const p0 = i === 0 ? pts[0] : pts[i - 1], p1 = pts[i], p2 = pts[i + 1], p3 = i + 2 < n ? pts[i + 2] : p2;
        const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
        const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
        d += `C ${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)} `;
      }
      return d;
    }
  }

  function smootherstep(t) { return t * t * (3 - 2 * t); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }
  function lerpPts(a, b, t) { return a.map((p, i) => [p[0] + (b[i][0] - p[0]) * t, p[1] + (b[i][1] - p[1]) * t]); }

  function applyPhysics(pts) {
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (let p of pts) {
      if (p[0] < minX) minX = p[0]; if (p[0] > maxX) maxX = p[0];
      if (p[1] < minY) minY = p[1]; if (p[1] > maxY) maxY = p[1];
    }
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    const sf = clamp(smoothedForward, -8, 8);
    const sx = 1 + (sf * 0.035), sy = 1 - (sf * 0.035); 
    const skew = driveTiltX * -0.025; 
    let jx = 0, jy = 0;
    if (drivingArousalBoost > 0.6) {
      const intensity = (drivingArousalBoost - 0.6) * 2.5;
      jx = (Math.random() - 0.5) * 2 * intensity;
      jy = (Math.random() - 0.5) * 2 * intensity;
    }
    return pts.map(p => {
      let dx = p[0] - cx, dy = p[1] - cy;
      dx += dy * skew; 
      return [cx + (dx * sx) + jx, cy + (dy * sy) + jy];
    });
  }

  function morphTo(key, duration, cb) {
    cancelAnimationFrame(morphAnim);
    const startL = curLeft.map(p => p.slice()), startR = curRight.map(p => p.slice());
    const startM = curMouth.map(p => p.slice());
    
    const endL = SHAPES[key].left, endR = SHAPES[key].right;
    const endM = EXPR_DATA[key].m;

    eyesGroup.style.fill = targetColor;
    pathMouth.style.stroke = targetColor;
    pathMouth.style.opacity = EXPR_DATA[key].mo !== undefined ? EXPR_DATA[key].mo : 1;
    
    document.querySelectorAll('.hud-item').forEach(el => el.classList.remove('active'));
    if (targetHUD) document.getElementById(targetHUD).classList.add('active');

    const t0 = performance.now();
    function step(now) {
      const t = Math.min(1, (now - t0) / duration);
      const te = smootherstep(t);
      curLeft = lerpPts(startL, endL, te);
      curRight = lerpPts(startR, endR, te);
      curMouth = lerpPts(startM, endM, te);
      if (t < 1) { morphAnim = requestAnimationFrame(step); }
      else { currentExpr = key; if (cb) cb(); }
    }
    morphAnim = requestAnimationFrame(step);
  }

  let pointer = { x: null, y: null };

  let wanderTarget = { x: 0, y: 0 };

  function maybeMicroSaccade() {
    if (Math.random() < 0.5) {
      microJitterX = (Math.random() - 0.5) * 3;
      microJitterY = (Math.random() - 0.5) * 1.6;

  function updateGaze() {
    const usingPointer = pointer.x !== null && idleSeconds() < 6;
    let tx, ty;
    if (usingPointer) {
      tx = (pointer.x - 0.5) * 2;
      ty = (pointer.y - 0.5) * 2;
    } else {
      tx = wanderTarget.x;
      ty = wanderTarget.y;

    const maxOffset = 7; 
    let jx = 0, jy = 0;
    if (performance.now() < microJitterUntil) { jx = microJitterX; jy = microJitterY; }
    gazeX = lerp(gazeX, tx * maxOffset + jx, 0.06);
    gazeY = lerp(gazeY, ty * maxOffset * 0.5 + jy, 0.06);
    const ex = gazeX + driveTiltX, ey = gazeY + driveTiltY;
    eyesGroup.setAttribute('transform', `translate(${ex.toFixed(1)},${ey.toFixed(1)})`);
  }

  let breatheStart = performance.now();
  let lastOrientAt = 0;

  function mainLoop(now) {
    updateGaze();

    if (performance.now() - lastOrientAt > 1200) {
      driveTiltX = lerp(driveTiltX, 0, 0.04);
      driveTiltY = lerp(driveTiltY, 0, 0.04);
      driveRoll = lerp(driveRoll, 0, 0.04);
      smoothedForward = lerp(smoothedForward, 0, 0.04);
    }

    const arousalNorm = clamp(drivingArousalBoost, 0, 1);
    const t = (now - breatheStart) / 1000;
    const speed = lerp(0.9, 1.6, arousalNorm);
    const s = 1 + Math.sin(t * speed) * 0.012;
    svgEl.style.transform = `scale(${s}) rotate(${driveRoll.toFixed(2)}deg)`;

    render();
    requestAnimationFrame(mainLoop);
  }
  requestAnimationFrame(mainLoop);

  const driveBtn = document.getElementById('driveBtn');
  let driveEnabled = false;
  let orientBaseline = { beta: 0, gamma: 0 };
  let lastGamma = null, lastGammaTime = performance.now();
  let lastReactAt = 0;

  function calibrateBaseline(beta, gamma) {
    orientBaseline.beta = beta || 0;
    orientBaseline.gamma = gamma || 0;
  }

  function driveReact(key, dv, da, snapBack) {
    const now = performance.now();
    if (now - lastReactAt < 500) return;
    lastReactAt = now;
    markActivity();
    morphTo(key, 110, () => {
      setTimeout(() => { if (running && !debugMode) morphTo(baseExpr, snapBack || 300); }, 450);
    });
  }

  function handleOrientation(e) {
    if (e.beta === null || e.gamma === null) return;
    lastOrientAt = performance.now();
    const pitch = clamp((e.beta - orientBaseline.beta) / 30, -1, 1);   
    const roll  = clamp((e.gamma - orientBaseline.gamma) / 30, -1, 1); 

    driveTiltX = lerp(driveTiltX, roll * 9, 0.15);
    driveTiltY = lerp(driveTiltY, -pitch * 5, 0.15);
    driveRoll  = lerp(driveRoll, roll * 4, 0.12);

    const now = performance.now();
    const dt = (now - lastGammaTime) / 1000;
    
    if (lastGamma !== null && dt > 0) {
      const rate = (e.gamma - lastGamma) / dt; 
      if (Math.abs(rate) > 40) {
        if (Math.abs(rate) > 130 && drivingArousalBoost > 0.3) {
            driveReact('Dizzy', -0.2, 0.5, 1500); 
        } else if (drivingArousalBoost > 0.6) {
            driveReact(Math.abs(rate) > 90 ? 'Scared' : 'worry', -0.1, 0.35); 
        } else if (drivingArousalBoost > 0.15) {
            driveReact('Focused_or_Determined', 0.0, 0.2); 
        }
      }
    }
    lastGamma = e.gamma; lastGammaTime = now;

    if (Math.abs(pitch) > 0.55 && Math.random() < 0.015) {
      driveReact(pitch > 0 ? 'Awe' : 'surprised', pitch > 0 ? 0.1 : -0.1, 0.2, 260);
    }
  }

  function handleMotion(e) {
    const a = e.acceleration && (e.acceleration.y || e.acceleration.x)
      ? e.acceleration : e.accelerationIncludingGravity;
    if (!a) return;
    const forward = a.y || 0;
    smoothedForward = lerp(smoothedForward, forward, 0.25);

    if (drivingArousalBoost > 0.1) {
      if (smoothedForward < -6 && drivingArousalBoost > 0.5) {
          driveReact('Scared', -0.3, 0.5); 
      } else if (smoothedForward < -4) {
          driveReact('surprised', -0.1, 0.3); 
      } else if (smoothedForward > 5) {
          driveReact('Glee', 0.3, 0.5); 
      }
    }
  }

  async function enableDriveMode() {
    if (driveEnabled) return;
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        if (await DeviceOrientationEvent.requestPermission() !== 'granted') return;
      }
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        if (await DeviceMotionEvent.requestPermission() !== 'granted') return;
      }
      window.addEventListener('deviceorientation', e => {
        if (orientBaseline.beta === 0 && orientBaseline.gamma === 0) calibrateBaseline(e.beta, e.gamma);
        handleOrientation(e);
      });
      window.addEventListener('devicemotion', handleMotion);
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(pos => {
          const speed = pos.coords.speed; 
          if (speed !== null && speed >= 0) {
            currentSpeedKmh = speed * 3.6;
            drivingArousalBoost = clamp(currentSpeedKmh / 80, 0, 1);
          }
        }, () => {}, { enableHighAccuracy: true, maximumAge: 2000 });
      }
      driveEnabled = true;
      driveBtn.classList.add('on');
      driveBtn.style.display = 'none'; 
    } catch (err) { console.warn('Drive mode sensor permission error', err); }
  }

  driveBtn.addEventListener('click', enableDriveMode);

  const simPanel = document.getElementById('simPanel');
  const simToggle = document.getElementById('simToggle');
  const simSpeed = document.getElementById('simSpeed');
  const simSpeedVal = document.getElementById('simSpeedVal');

  simToggle.addEventListener('click', () => {
    simPanel.classList.toggle('open');
    simToggle.classList.toggle('open');
  });

  function simLean(dir) { 
    lastOrientAt = performance.now();
    driveTiltX = dir * 9; driveRoll = dir * 4;
  }
  const SIM_ACTIONS = {
    turnL: () => { simLean(-1); 
        if (currentSpeedKmh > 70) driveReact('Scared', -0.1, 0.35); 
        else if (currentSpeedKmh > 40) driveReact('worry', -0.05, 0.25);
        else if (currentSpeedKmh > 10) driveReact('Focused_or_Determined', 0, 0.15);
    },
    turnR: () => { simLean(1); 
        if (currentSpeedKmh > 70) driveReact('Scared', -0.1, 0.35); 
        else if (currentSpeedKmh > 40) driveReact('worry', -0.05, 0.25);
        else if (currentSpeedKmh > 10) driveReact('Focused_or_Determined', 0, 0.15);
    },
    brake: () => { lastOrientAt = performance.now(); smoothedForward = -6; 
        if (currentSpeedKmh > 50) driveReact('Scared', -0.3, 0.5);
        else if (currentSpeedKmh > 10) driveReact('surprised', -0.1, 0.3);
    },
    accel: () => { lastOrientAt = performance.now(); smoothedForward = 6; driveReact('Glee', 0.3, 0.5); },
    hillUp: () => driveReact('Awe', 0.1, 0.2, 260),
    hillDown: () => driveReact('surprised', -0.1, 0.2, 260),
    tiltL: () => simLean(-1),
    tiltR: () => simLean(1),
    spin: () => { driveTiltX = 20; driveRoll = 15; driveReact('Dizzy', -0.2, 0.5, 1500); }
  };
  simPanel.querySelectorAll('[data-sim]').forEach(btn => {
    btn.addEventListener('click', () => {
      lastReactAt = 0; 
      SIM_ACTIONS[btn.dataset.sim]();
    });
  });
  simSpeed.addEventListener('input', () => {
    currentSpeedKmh = Number(simSpeed.value);
    drivingArousalBoost = clamp(currentSpeedKmh / 80, 0, 1);
    simSpeedVal.textContent = currentSpeedKmh + ' km/h';
  });

  let keysDown = new Set();
  let simSpeedKmh = 0;

  window.addEventListener('keydown', e => {
    if (!simPanel.classList.contains('open')) return;
    const k = e.key.toLowerCase();
    if (!['w', 'a', 's', 'd'].includes(k)) return;
    e.preventDefault();
    if (keysDown.has(k)) return; 
    keysDown.add(k);
    lastReactAt = 0; 
    
    if (k === 'w' && currentSpeedKmh < 15) driveReact('Glee', 0.3, 0.5);
    if (k === 's' && currentSpeedKmh > 40) driveReact('Scared', -0.3, 0.5);
    else if (k === 's' && currentSpeedKmh > 10) driveReact('surprised', -0.1, 0.3);
    
    if (k === 'a' || k === 'd') {
      if (currentSpeedKmh > 70) driveReact('Scared', -0.1, 0.35);
      else if (currentSpeedKmh > 40) driveReact('worry', -0.05, 0.25);
      else if (currentSpeedKmh > 10) driveReact('Focused_or_Determined', 0, 0.15);
    }
  });
  window.addEventListener('keyup', e => keysDown.delete(e.key.toLowerCase()));

  setInterval(() => {
    if (!simPanel.classList.contains('open')) return;
    if (keysDown.has('w')) {
      simSpeedKmh = clamp(simSpeedKmh + 4, 0, 120);
      smoothedForward = lerp(smoothedForward, 5, 0.2); 
      lastOrientAt = performance.now();
    }
    else if (keysDown.has('s')) {
      simSpeedKmh = clamp(simSpeedKmh - 6, 0, 120);
      smoothedForward = lerp(smoothedForward, -6, 0.2); 
      lastOrientAt = performance.now();
    }
    else {
      simSpeedKmh = clamp(simSpeedKmh - 1, 0, 120); 
    }

    currentSpeedKmh = simSpeedKmh;
    drivingArousalBoost = clamp(currentSpeedKmh / 80, 0, 1);
    simSpeed.value = currentSpeedKmh;
    simSpeedVal.textContent = Math.round(currentSpeedKmh) + ' km/h';

    if (keysDown.has('a')) {
      lastOrientAt = performance.now();
      driveTiltX = lerp(driveTiltX, -9, 0.3); driveRoll = lerp(driveRoll, -4, 0.3);
    } else if (keysDown.has('d')) {
      lastOrientAt = performance.now();
      driveTiltX = lerp(driveTiltX, 9, 0.3); driveRoll = lerp(driveRoll, 4, 0.3);
    }
  }, 80);

  function blinkLoop() {
    if (running && currentExpr === baseExpr && !debugMode) {
      const tiredness = (drivingArousalBoost > 0.2) ? 0 : clamp(idleSeconds() / 90, 0, 0.4);
      const closeDur = lerp(70, 160, tiredness);
      const holdDur = lerp(60, 260, tiredness);
      morphTo('Blink', closeDur, () => {
        setTimeout(() => { if (running && !debugMode) morphTo(baseExpr, closeDur + 20); }, holdDur);
      });
    }
    const base = 2200 + Math.random() * 3000;
    setTimeout(blinkLoop, base);
  }
  setTimeout(blinkLoop, 2000);

  function getRandomExpression() {
    let allowed = [...CANDIDATES];
    if (currentSpeedKmh > 5) {
        allowed = allowed.filter(k => !['sleepy', 'Sad__look_down_', 'Frustrated_or_Bored', 'sad__look_at_user_', 'Processing'].includes(k));
    }
    if (currentSpeedKmh > 50) {
        allowed = ['Focused_or_Determined', 'Glee', 'Happy', 'Awe', 'surprised', 'Scared', 'worry', 'Furious', 'angery', 'Love', 'Mischievous'];
    } 
    else if (currentSpeedKmh >= 20 && currentSpeedKmh <= 40 && Math.abs(smoothedForward) < 2.5) {
        allowed = ['Neutral', 'Happy', 'Relieved', 'Squint', 'Mischievous'];
    }

    const randomIdx = Math.floor(Math.random() * allowed.length);
    return allowed[randomIdx];
  }

  function randomCognitiveLoop() {
    if (running && !debugMode) {
      const newExpr = getRandomExpression();
      if (newExpr !== baseExpr && currentExpr === baseExpr) {
        baseExpr = newExpr;
        const morphDur = 150 + Math.random() * 450; 
        morphTo(baseExpr, morphDur);
      }
    }
    
    let randomHoldTime;
    if (currentSpeedKmh > 50) {
        randomHoldTime = 8000 + (Math.random() * 17000); 
    } else if (currentSpeedKmh >= 20 && currentSpeedKmh <= 40 && Math.abs(smoothedForward) < 2.5) {
        randomHoldTime = 20000 + (Math.random() * 40000);
    } else if (currentSpeedKmh > 5) {
        randomHoldTime = 15000 + (Math.random() * 25000);
    } else {
        randomHoldTime = 40000 + (Math.random() * 140000);
    }

    setTimeout(randomCognitiveLoop, randomHoldTime);
  }
  setTimeout(randomCognitiveLoop, 3000);

  document.querySelector('.stage').addEventListener('click', () => {
    if (!running || debugMode) return;
    markActivity();
    const key = getRandomExpression();
    morphTo(key, 160, () => {
      setTimeout(() => { if (running && !debugMode) morphTo(baseExpr, 300); }, 500 + Math.random() * 400);
    });
  });

  liveDot.addEventListener('click', () => {
    running = !running;
    liveDot.classList.toggle('live', running);
    if (running) { markActivity(); morphTo(baseExpr, 200); }
  });
  liveDot.classList.add('live');
</script>
</body>
</html>
